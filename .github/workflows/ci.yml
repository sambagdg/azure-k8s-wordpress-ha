name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - name: Vérifier le formatage
        run: terraform fmt -check -recursive
      - name: Initialiser (sans backend)
        run: terraform init -backend=false
      - name: Valider la configuration
        run: terraform validate

  ansible:
    name: Ansible (lint + syntaxe)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer Ansible et ansible-lint
        run: pip install ansible ansible-lint
      - name: Vérifier la syntaxe des playbooks
        run: |
          ansible-playbook site.yml --syntax-check
          ansible-playbook backup.yml --syntax-check
      - name: Analyser avec ansible-lint
        run: ansible-lint

  kubernetes:
    name: Manifestes Kubernetes (kubeconform)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Installer kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Valider les manifestes
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            kubernetes/0*.yaml kubernetes/ci/*.yaml monitoring/probe-wordpress.yaml monitoring/alert-rules.yaml

  secrets:
    name: Détection de secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Installer gitleaks
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oP '"tag_name": "v\K[^"]+')
          echo "gitleaks $VERSION"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Analyser tout l'historique Git
        run: gitleaks git --verbose --redact .
