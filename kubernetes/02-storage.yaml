apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-mysql
  labels:
    app: mysql
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-static
  nfs:
    server: 10.10.1.12
    path: /srv/nfs/mysql
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-wordpress
  labels:
    app: wordpress
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-static
  nfs:
    server: 10.10.1.12
    path: /srv/nfs/wordpress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: gandega-project1
spec:
  storageClassName: nfs-static
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      app: mysql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-pvc
  namespace: gandega-project1
spec:
  storageClassName: nfs-static
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      app: wordpress
