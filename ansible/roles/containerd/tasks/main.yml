---
- name: Installer containerd
  ansible.builtin.apt:
    name: containerd
    state: present

- name: Créer le dossier de configuration
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Générer la configuration par défaut
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Activer le pilote cgroup systemd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: "SystemdCgroup = false"
    replace: "SystemdCgroup = true"
  notify: Redémarrer containerd

- name: Démarrer et activer containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
